name: Travel planner tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: JavaScript syntax
        run: |
          for file in core.js crypto.js sync.js session.js app.js; do
            node --check "$file"
          done
